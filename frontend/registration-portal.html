<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Portal | AI-Powered IDS</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .portal-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .portal-card {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            position: relative;
        }
        .top-login-link {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(37, 99, 235, 0.1) !important;
            border: 1px solid rgba(37, 99, 235, 0.25) !important;
            color: #60a5fa !important;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            line-height: 1.2;
            white-space: nowrap;
        }
        .top-login-link:hover {
            background: rgba(37, 99, 235, 0.22) !important;
            border-color: rgba(37, 99, 235, 0.5) !important;
            color: #93c5fd !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
        }
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .login-header h1 {
            font-size: 2.5rem;
            color: #2563eb;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .login-header p {
            color: #6b7a99;
            font-size: 1rem;
        }
        .portal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }
        .role-card {
            display: block;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .role-card:hover {
            background: rgba(37, 99, 235, 0.08);
            border-color: rgba(37, 99, 235, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2), 0 0 20px rgba(37, 99, 235, 0.25);
        }
        .role-icon {
            font-size: 2.5rem;
            color: #2563eb;
            margin-bottom: 20px;
        }
        .role-card h2 {
            color: #e8eaf0;
            font-size: 1.5rem;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .role-card p {
            color: #6b7a99;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .portal-footer {
            text-align: center;
            margin-top: 20px;
        }
        .forgot-link {
            color: #6b7a99;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .forgot-link:hover {
            color: #3b82f6;
        }
        .forgot-link i {
            margin-right: 8px;
        }
        @media (max-width: 600px) {
            .portal-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <div class="portal-card">
            <div class="login-header">
                <h1>Registration Portal</h1>
                <p>Select your role to proceed with account creation</p>
            </div>

            <div class="portal-grid">
                <a href="register-admin.html" class="role-card">
                    <div class="role-icon">
                        <i class="fas fa-user-shield"></i>
                    </div>
                    <h2>Admin</h2>
                    <p>Manage system security, users, and global configurations.</p>
                </a>

                <a href="register-analyst.html" class="role-card">
                    <div class="role-icon">
                        <i class="fas fa-microscope"></i>
                    </div>
                    <h2>Analyst</h2>
                    <p>Monitor threats, analyze logs, and generate reports.</p>
                </a>
            </div>

            <div class="portal-footer">
                <a href="index.html" class="top-login-link" style="position: static; display: inline-flex;">
                    <i class="fas fa-sign-in-alt"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
