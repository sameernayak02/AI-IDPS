<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | AI-Powered IDS</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .reg-form-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .reg-form-card {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            position: relative;
        }
        .top-login-link {
            position: absolute;
            top: 30px;
            right: 30px;
            color: #6b7a99;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
        }
        .top-login-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .admin-badge {
            background: rgba(255, 165, 2, 0.1);
            color: #ffa502;
            border: 1px solid rgba(255, 165, 2, 0.2);
        }
        .form-section-label {
            color: #ffa502;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 25px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .form-row {
            display: grid;
            gap: 20px;
            margin-bottom: 20px;
        }
        .three-col { grid-template-columns: 1fr 1fr 1fr; }
        .two-col { grid-template-columns: 1fr 1fr; }
        .full-col { grid-template-columns: 1fr; }

        .form-group label {
            display: block;
            color: #6b7a99;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .required { color: #ff4757; }
        
        .input-wrapper input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            color: #e8eaf0;
            font-size: 0.9rem;
            transition: all 0.3s;
            outline: none;
        }
        .input-wrapper input:focus {
            border-color: #ffa502;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(255, 165, 2, 0.1);
        }
        
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffa502 0%, #ff7f50 100%);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 165, 2, 0.3);
        }
        
        @media (max-width: 600px) {
            .three-col, .two-col { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="reg-form-container">
        <div class="reg-form-card">
            <a href="index.html" class="top-login-link">
                <i class="fas fa-sign-in-alt"></i> Login
            </a>
            <div class="login-header">
                <div class="role-badge admin-badge">
                    <i class="fas fa-user-shield"></i> Admin
                </div>
                <h1>Admin Registration</h1>
                <p>Create your administrator account for AI-Powered IDS</p>
            </div>

            <form id="adminRegForm">
                <!-- Row 1: Name -->
                <div class="form-section-label">Personal Information</div>
                <div class="form-row three-col">
                    <div class="form-group">
                        <label for="first_name">First Name <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="text" id="first_name" name="first_name" placeholder="First name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="middle_name">Middle Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="middle_name" name="middle_name" placeholder="Middle name">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="text" id="last_name" name="last_name" placeholder="Last name" required>
                        </div>
                    </div>
                </div>

                <!-- Row 2: Contact -->
                <div class="form-section-label">Contact Details</div>
                <div class="form-row two-col">
                    <div class="form-group">
                        <label for="email">Email ID <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="mobile">Mobile Number <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="tel" id="mobile" name="mobile" placeholder="+91 XXXXX XXXXX" pattern="[0-9+\-\s]{7,15}" required>
                        </div>
                    </div>
                </div>

                <!-- Row 3: DOB + Country -->
                <div class="form-row two-col">
                    <div class="form-group">
                        <label for="dob">Date of Birth <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="text" id="dob" name="dob" placeholder="DD/MM/YYYY"
                                   pattern="\d{2}/\d{2}/\d{4}"
                                   oninput="formatDOB(this)" maxlength="10" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="country">Country <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="text" id="country" name="country" placeholder="e.g. India" required>
                        </div>
                    </div>
                </div>

                <!-- Row 4: State + City -->
                <div class="form-section-label">Location</div>
                <div class="form-row two-col">
                    <div class="form-group">
                        <label for="state">State <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="text" id="state" name="state" placeholder="e.g. Maharashtra" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="city">City <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="text" id="city" name="city" placeholder="e.g. Mumbai" required>
                        </div>
                    </div>
                </div>

                <!-- Row 5: Credentials -->
                <div class="form-section-label">Account Credentials</div>
                <div class="form-row full-col">
                    <div class="form-group">
                        <label for="userid">User ID <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="text" id="userid" name="userid" placeholder="Choose a unique User ID" required>
                        </div>
                    </div>
                </div>

                <!-- Row 6: Password -->
                <div class="form-row two-col">
                    <div class="form-group">
                        <label for="password">Password <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm Password <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-check-circle"></i> Submit Registration
                </button>
            </form>

            <p id="reg-error" class="text-red-400 mt-4 text-sm hidden text-center font-medium"></p>
            <p id="reg-success" class="text-green-400 mt-4 text-sm hidden text-center font-medium"></p>

            <div class="portal-footer" style="margin-top:1.5rem; text-align: center;">
                <a href="registration-portal.html" class="forgot-link" style="color: #6b7a99; text-decoration: none; font-size: 0.9rem;">
                    <i class="fas fa-arrow-left"></i> Back to Portal
                </a>
            </div>
        </div>
    </div>

    <script>
        function formatDOB(input) {
            let v = input.value.replace(/\D/g, '');
            if (v.length >= 3 && v.length <= 4) {
                v = v.slice(0,2) + '/' + v.slice(2);
            } else if (v.length >= 5) {
                v = v.slice(0,2) + '/' + v.slice(2,4) + '/' + v.slice(4,8);
            }
            input.value = v;
        }
    </script>
    <script src="js/register-admin.js"></script>
</body>
</html>
